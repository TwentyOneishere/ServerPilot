name: Extract ZIP
on: push
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      - run: |
          unzip "ServerPilot_FIXED (1).zip" -d extracted
          cp -r extracted/ServerPilot/. .
          rm -rf extracted "ServerPilot_FIXED (1).zip"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Extract project files" || echo "Nothing to commit"
          git push
